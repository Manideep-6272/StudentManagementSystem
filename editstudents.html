<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit student</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <a href="dashboard.html">Home</a>&nbsp;&nbsp;
      <a href="addstudents.html">Add students</a>&nbsp;&nbsp;
      <a href="viewstudents.html">View students</a>&nbsp;&nbsp;
      <a href="logout.html">Logout</a>
    </nav>
    <div class="addstudent">
      <h2>Edit student details</h2>
      <form>
        <label for="roll">Roll No</label>
        <input type="text" id="roll" name="roll"/>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="Manideep" />
        <label for="branch">Branch</label>
        <input type="text" id="branch" name="branch" value="DS" />
        <label for="cgpa">CGPA</label>
        <input type="number" id="cgpa" name="cgpa" value="8.49" />
        <button type="button" onclick="saveChanges()">Save changes</button>
      </form>
    </div>
    <script>
      let id;
      let student;
      async function edit(){
        id = new URLSearchParams(window.location.search).get("id");
        let stdntDetails = await fetch(`http://localhost:3000/students/${id}`);
        student = await stdntDetails.json();
        let roll = document.getElementById("roll");
        let name = document.getElementById("name");
        let branch = document.getElementById("branch");
        let cgpa = document.getElementById("cgpa");
        roll.value = student.roll;
        name.value = student.name;
        branch.value = student.branch;
        cgpa.value = student.cgpa;
      }
      async function saveChanges(){
        student.name = document.getElementById("name").value;
        student.branch = document.getElementById("branch").value;
        student.cgpa = document.getElementById("cgpa").value;
        let updatedStdnt = await fetch(`http://localhost:3000/students/${id}`,{
          method:"PATCH",
          body:JSON.stringify(student)
        })
        location.href='viewstudents.html';
      }
      edit();
    </script>
  </body>
</html>
