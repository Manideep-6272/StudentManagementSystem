<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <style>
      .container-grid {
        display: grid;
        grid-template-columns: 1fr 3fr;
        grid-template-rows: 1fr 4fr 1fr;
        grid-template-areas:
          "hd hd"
          "nv cntt"
          "ftr ftr";
        min-height: 100vh;
      }

      .header {
        background-color: #1b2a41;
        color: white;
        grid-area: hd;
      }

      .nav {
        background-color: #333;
        grid-area: nv;
        padding: 20px;
      }

      .nav-list {
        list-style: none;
        padding: 0;
      }

      .nav-list li {
        margin-bottom: 30px;
      }

      .nav-list a {
        color: white;
        text-decoration: none;
        font-size: 18px;
      }

      .nav-list a:hover {
        color: red;
        font-weight: bold;
      }

      .content {
        grid-area: cntt;
      }

      .footer {
        grid-area: ftr;
        background-color: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <div class="container-grid">
      <div class="header text-center py-4">
        <h1 class="display-5">Student Management System</h1>
      </div>

      <div class="nav">
        <ul class="nav-list">
          <li><a href="dashboard.html">🏠 Home</a></li>
          <li><a href="addstudents.html">➕ Add Student</a></li>
          <li><a href="viewstudents.html">📋 View Students</a></li>
          <li><a href="logout.html">🚪 Logout</a></li>
        </ul>
      </div>

      <div class="content d-flex justify-content-center align-items-center">
        <div class="card shadow p-4 text-center" style="max-width: 500px">
          <h2 class="text-primary">Welcome</h2>
          <p class="lead">
            This is a simple web application to manage student information.
          </p>
          <a href="addstudents.html" class="btn btn-primary"> Add Student </a>
        </div>
      </div>

      <div class="footer text-center py-3">
        <p class="mb-0">
          &copy; 2026 Student Management System. All rights reserved.
        </p>
      </div>
    </div>
  </body>
</html>
