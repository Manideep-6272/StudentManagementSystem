<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 1fr 3fr;
        grid-template-rows: 1fr 4fr 1fr;
        grid-template-areas:
          "hd hd"
          "nv cntt"
          "ftr ftr";
      }
      .header {
        background-color: #1b2a41;
        padding: 20px;
        text-align: center;
        color: white;
        grid-area: hd;
      }
      .nav {
        background-color: #333;
        padding: 10px;
        display: flex;
        flex-direction: column;
        grid-area: nv;
      }
      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 100px;
      }
      .nav-list a {
        color: white;
        text-decoration: none;
        font-size: 18px;
      }
      .nav-list a:hover {
        color: red;
        font-weight: bold;
        /* font-size: 20px; */
      }
      .content {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        grid-area: cntt;
      }
      .footer {
        background-color: #f2f2f2;
        padding: 10px;
        text-align: center;
        grid-area: ftr;
      }
      .addstudent{
        display: flex;
        flex-direction: column;
        width: 300px;
        margin: 50px auto;
        padding: 20px;
        border: 2px solid #1a1111;
        border-radius: 5px;
      }
      .addstudent form{
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      .addstudent label{
        font-size: 20px;
      }
      .addstudent input:focus{
        outline: none;
        border: 2px solid #1a1111;
        box-shadow: 0 0 5px rgba(67, 35, 113, 0.5);
      }
       .addstudent button{
        padding: 10px;
        background-color: #1a1111;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
    <script>
      function saveStudent(){
        event.preventDefault();
        let rollno = document.getElementById('roll').value;
        let name = document.getElementById('name').value;
        let branch = document.getElementById('branch').value;
        let cgpa = document.getElementById('cgpa').value;
        const student = {
          roll : rollno,
          name : name,
          branch : branch,
          cgpa : cgpa
        };

        let students = JSON.parse(localStorage.getItem('students')) || [];
        students.push(student);
        localStorage.setItem("students",JSON.stringify(students));
        location.href='viewstudents.html';
      }
    </script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Student Management System</h1>
      </div>
      <div class="nav">
        <ul class="nav-list">
          <li><a href="grid.html">Home</a></li>
          <li><a href="addstudents.html">Add Student</a></li>
          <li><a href="viewstudents.html">View Students</a></li>
          <li><a href="logout.html">Logout</a></li>
        </ul>
      </div>
      <div class="content">
        <div class="addstudent">
          <h2>Fill the below form to add student</h2>
          <form>
            <label for="roll">Enter roll no</label>
            <input type="text" id="roll" name="roll" required />
            <label for="name">Enter Name</label>
            <input type="text" id="name" name="name" required />
            <label for="branch">Enter Branch</label>
            <input type="text" id="branch" name="branch" required />
            <label for="cgpa">Enter CGPA</label>
            <input type="text" id="cgpa" name="cgpa" required />
            <button type="button" onclick="saveStudent()">Add student</button>
          </form>
        </div>
      </div>
      <div class="footer">
        <p>&copy; 2026 Student Management System. All rights reserved.</p>
      </div>
    </div>
  </body>
</html>
