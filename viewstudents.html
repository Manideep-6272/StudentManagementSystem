<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 1fr 3fr;
        grid-template-rows: 1fr 4fr 1fr;
        grid-template-areas:
          "hd hd"
          "nv cntt"
          "ftr ftr";
      }
      .header {
        background-color: #1b2a41;
        padding: 20px;
        text-align: center;
        color: white;
        grid-area: hd;
      }
      .nav {
        background-color: #333;
        padding: 10px;
        display: flex;
        flex-direction: column;
        grid-area: nv;
      }
      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 100px;
      }
      .nav-list a {
        color: white;
        text-decoration: none;
        font-size: 18px;
      }
      .nav-list a:hover {
        color: red;
        font-weight: bold;
        /* font-size: 20px; */
      }
      .content {
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        grid-area: cntt;
      }
      .footer {
        background-color: #f2f2f2;
        padding: 10px;
        text-align: center;
        grid-area: ftr;
      }
      #edit-link {
        background-color: green;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
      }

      #delete-link {
        background-color: red;
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-weight: bold;
      }
      .view-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* margin-top: px; */
      }
      .studenttable {
        border: 1px solid black;
        border-collapse: collapse;
        width: 80%;
        margin-top: 5px;
      }
      table {
        margin: 0 auto;
        width: 80%;
        border-collapse: collapse;
      }

      .view-container table,
      th,
      td {
        border: 2px solid black;
      }
      th,
      td {
        padding: 10px;
        text-align: center;
      }
      th {
        background-color: #432371;
        color: white;
        font-size: 20px;
      }
      td {
        font-size: 18px;
      }
      .view-container td a {
        text-decoration: none;
        color: #ffffff;
      }
    </style>
  </head>

      <div class="header">
        <h1>Student Management System</h1>
      </div>
      <div class="nav">
