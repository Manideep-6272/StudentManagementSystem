<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function validateUser(){
            event.preventDefault();
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            let user = JSON.parse(localStorage.getItem(username));
            if (password !== user.password){
                alert("password incorrect");
                return;
            }
            location.href='dashboard.html';
        }
    </script>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>&nbsp;&nbsp;&nbsp;
        <a href="login.html">Login</a>&nbsp;&nbsp;&nbsp;
        <a href="register.html">Register</a>
    </nav>
    <div class="login-container">
        <h1>Login</h1>
        <form>
            <label for="username">Enter username</label>
            <input type="text" id="username" name="userna" required>
            <label for="password">Enter password</label>
            <input type="password" id="password" name="passwo" required>
            <label>Don't have an account? <a href="register.html">Register</a></label>
            <button type="button" onclick="validateUser()">login</button>
        </form>
    </div>
</body>
</html>
