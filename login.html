<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script>
        async function validateUser(){
            event.preventDefault();
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;
            let response = await fetch('http://localhost:4000/login');
            let data = await response.json();
            let usersData = data.users;
            if (usersData.some(user => user.username === username && user.password === password)){
                console.log("Login success")
                location.href='dashboard.html';
            }
            else{
                alert("Invalid username or password");
            }
        }
    </script>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>&nbsp;&nbsp;&nbsp;
        <a href="login.html">Login</a>&nbsp;&nbsp;&nbsp;
        <a href="register.html">Register</a>
    </nav>
    <div class="login-container">
        <h1>Login</h1>
        <form onsubmit="validateUser()">
            <label for="username">Enter username</label>
            <input type="text" id="username" name="userna" required>
            <label for="password">Enter password</label>
            <input type="password" id="password" name="passwo" required>
            <label>Don't have an account? <a href="register.html">Register</a></label>
            <button type="submit">login</button>
        </form>
    </div>
</body>
</html>
